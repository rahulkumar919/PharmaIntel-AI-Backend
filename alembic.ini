# alembic.ini — Alembic configuration file
# Run migrations from the backend/ directory:
#   alembic upgrade head          (apply all pending migrations)
#   alembic downgrade -1          (roll back one migration)
#   alembic revision --autogenerate -m "description"  (generate a new migration)

[alembic]
# The migrations directory
script_location = alembic

# Intentionally empty here — the URL is loaded from app.config in env.py
# so we never hardcode credentials in this committed file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
